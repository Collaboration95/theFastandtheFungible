name: Feature
description: Propose a change
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Who is stuck, and on what?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
    validations:
      required: true
  - type: dropdown
    id: criterion
    attributes:
      label: Judging criterion served
      description: See docs/JUDGING-CRITERIA.md.
      options: [Reachability, Creativity, Feasibility, Technical depth, UX & design, Builder feedback, Upkeep]
    validations:
      required: true
