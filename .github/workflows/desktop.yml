name: desktop
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  dmg:
    runs-on: macos-15
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: make dmg
      - uses: actions/upload-artifact@v4
        with:
          name: researchagent-arm64-dmg
          path: desktop/out/*.dmg
          retention-days: 14
      - name: Attach this tag's DMG
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAG: ${{ github.ref_name }}
        run: gh release upload "$TAG" desktop/out/*.dmg --clobber
