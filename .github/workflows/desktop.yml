name: desktop
on:
  push:
    tags: ['desktop-check-*']
  workflow_call:
  workflow_dispatch:
    inputs:
      signing_identity:
        description: 'OWNER ONLY: exact Developer ID Application identity for sign=true'
        type: string
        default: ''
      sign:
        description: 'OWNER ONLY: sign and notarise using configured secrets'
        type: boolean
        default: false
      version:
        description: 'Optional package version for a pre-release validation build'
        type: string
        default: ''
permissions:
  contents: write
jobs:
  dmg:
    strategy:
      matrix:
        arch: [arm64, x64]
    runs-on: macos-15
    timeout-minutes: 20
    env:
      DESKTOP_ARCH: ${{ matrix.arch }}
      GH_TOKEN: ${{ github.token }}
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # ELECTRON_SKIP_BINARY_DOWNLOAD skips electron's postinstall; fetch the exact arch binary via gh.
      - name: Download the Electron binary for this arch
        run: node desktop/download.mjs
      - name: Owner-dispatched signing setup
        if: github.event_name == 'workflow_dispatch' && inputs.sign == true
        run: node desktop/ci-signing.mjs
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      - name: Build the requested version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_NAME" == desktop-check-* ]]; then
            export DESKTOP_VERSION="${GITHUB_REF_NAME#desktop-check-}"
          fi
          if [[ "$OWNER_SIGN" == true ]]; then
            node desktop/build.mjs --dmg --sign
          else
            node desktop/build.mjs --dmg --unsigned
          fi
        env:
          DESKTOP_VERSION: ${{ inputs.version || '' }}
          CSC_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.signing_identity || '' }}
          OWNER_SIGN: ${{ github.event_name == 'workflow_dispatch' && inputs.sign == true }}
      - uses: actions/upload-artifact@v4
        with:
          name: researchagent-${{ matrix.arch }}-dmg
          path: desktop/out/*.dmg
          retention-days: 14
