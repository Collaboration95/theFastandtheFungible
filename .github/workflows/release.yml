name: release
# Pushing a v* tag (made by scripts/release.mjs) publishes a GitHub release.
# Build the DMG for this exact tag once, then publish it with the tag annotation.
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  actions: read

jobs:
  desktop:
    uses: ./.github/workflows/desktop.yml
  publish:
    needs: desktop
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - name: Read the tag notes
        run: |
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
          git for-each-ref "refs/tags/$TAG" --format='%(contents)' > "$RUNNER_TEMP/notes.md"
          test -s "$RUNNER_TEMP/notes.md" || { echo "::error::$TAG has no annotation; create it with scripts/release.mjs"; exit 1; }
      - uses: actions/download-artifact@v4
        with:
          name: researchagent-arm64-dmg
          path: ${{ runner.temp }}/assets
      - name: Describe the unsigned download
        run: |
          printf '\n\nApple Silicon Mac app attached. Unsigned: move to Applications, then right-click → Open (Privacy & Security → Open Anyway if blocked). See desktop/SIGNING.md.\n' >> "$RUNNER_TEMP/notes.md"
      - name: Create the release
        run: |
          title=$(head -n 1 "$RUNNER_TEMP/notes.md")
          shopt -s nullglob
          assets=("$RUNNER_TEMP"/assets/*)
          gh release create "$TAG" --verify-tag --title "$TAG · $title" --notes-file "$RUNNER_TEMP/notes.md" "${assets[@]}"
