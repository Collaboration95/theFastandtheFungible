name: release
# Pushing a v* tag (made by scripts/release.mjs) publishes a GitHub release.
# Build the DMG for this exact tag once, then publish it with the tag annotation.
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  actions: read

jobs:
  acceptance:
    uses: ./.github/workflows/ci.yml
  desktop:
    needs: acceptance
    uses: ./.github/workflows/desktop.yml
  publish:
    needs: [acceptance, desktop]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - name: Read the tag notes
        run: |
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
          git for-each-ref "refs/tags/$TAG" --format='%(contents)' > "$RUNNER_TEMP/notes.md"
          test -s "$RUNNER_TEMP/notes.md" || { echo "::error::$TAG has no annotation; create it with scripts/release.mjs"; exit 1; }
      - name: Preserve Latest when backfilling an older version
        run: |
          git fetch --tags origin
          newest=$(git tag -l 'v*' --sort=-v:refname | head -n 1)
          if [ "$TAG" = "$newest" ]; then
            echo 'RELEASE_LATEST=true' >> "$GITHUB_ENV"
          else
            echo 'RELEASE_LATEST=false' >> "$GITHUB_ENV"
          fi
      - uses: actions/download-artifact@v4
        with:
          pattern: researchagent-*-dmg
          merge-multiple: true
          path: ${{ runner.temp }}/assets
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: accepted-release-artifacts
          path: dist/release/
      - name: Admit exact accepted bytes and source
        run: node scripts/admit-release.mjs
        env:
          ACCEPTANCE_RESULT: ${{ needs.acceptance.result }}
      - run: cp dist/release/* "$RUNNER_TEMP/assets/"
      - name: Stable unsigned DMG aliases with manifest hashes
        run: node scripts/desktop-release-assets.mjs "$RUNNER_TEMP/assets"
      - name: Describe the unsigned download
        run: |
          printf '\n\nApple Silicon and Intel Mac apps attached. Unsigned: move to Applications, then right-click → Open (Privacy & Security → Open Anyway if blocked). See desktop/SIGNING.md.\n' >> "$RUNNER_TEMP/notes.md"
      - name: Create the release
        run: |
          title=$(head -n 1 "$RUNNER_TEMP/notes.md")
          shopt -s nullglob
          assets=("$RUNNER_TEMP"/assets/*)
          gh release create "$TAG" --verify-tag --latest="$RELEASE_LATEST" --title "$TAG · $title" --notes-file "$RUNNER_TEMP/notes.md" "${assets[@]}"
