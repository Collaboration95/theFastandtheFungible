name: ci
on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DOTENV_CONFIG_PATH: .playwright/no-env
  LANGFUSE_ENABLED: '0'
  LLM_PROVIDER: fixture
  DECISION_PROVIDER: fixture
  SETTLEMENT_RAIL: simulated
  SEARCH_EMBEDDINGS: 'off'
  ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.detect.outputs.full }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - id: detect
        env:
          BASE_SHA: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && '' || github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/ci-contract.mjs detect

  verify:
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run hygiene && npm run lint && npm run typecheck
      - run: npx vitest run --coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-summary
          path: coverage/coverage-summary.json
          retention-days: 7
      - run: node scripts/check-coverage.mjs
      - run: npm run test:sdk:package
      - run: npm run readme:check

  chaos:
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run chaos:smoke
      - run: npx tsx scripts/chaos/key-reveal.ts

  browser:
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: chromium-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - run: npx playwright install --with-deps chromium
      - name: Build replay once and seal exact bytes
        run: |
          npm run build:demo
          find site/demo -type f -print0 | sort -z | xargs -0 sha256sum > "$RUNNER_TEMP/replay.sha256"
      - name: Independent browser groups (all required)
        shell: bash
        run: |
          sha256sum --check "$RUNNER_TEMP/replay.sha256"
          npx playwright test tests/e2e.spec.ts tests/a11y.spec.ts tests/settings.spec.ts tests/foundation.spec.ts tests/perf.spec.ts --output=test-results/app &
          app=$!
          npx playwright test --config playwright.demo.config.ts --output=test-results/demo &
          demo=$!
          npx playwright test --config playwright.judge.config.ts --output=test-results/judge &
          judge=$!
          result=0
          for pid in "$app" "$demo" "$judge"; do
            wait "$pid" || result=1
          done
          sha256sum --check "$RUNNER_TEMP/replay.sha256"
          exit "$result"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-diagnostics
          path: test-results/
          retention-days: 7

  python:
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install pytest
      - run: python -m pytest packages/sdk-python

  artifacts:
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: npm ci
      - run: make release-artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: accepted-release-artifacts
          path: dist/release/
          retention-days: 14

  check:
    if: always()
    needs: [changes, verify, chaos, browser, python, artifacts]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: node scripts/ci-contract.mjs aggregate
