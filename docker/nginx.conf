server {
  listen 8080;
  server_tokens off;
  root /usr/share/nginx/html;
  # Docker's DNS, re-resolved so an api restart with a new IP keeps working.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api http://api:8788;
  set $publisher http://publisher:8790;

  location / { try_files $uri $uri/ /index.html; }
  location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }

  # Same routes the Vite dev proxy forwards. SSE (/runs/:id/events) needs no buffering.
  location ~ ^/(runs|api)(/|$) {
    proxy_pass $api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
    client_max_body_size 64k;
  }

  # Writer sites and citation deep links (#145): the publisher serves /w/*.
  location /w/ {
    proxy_pass $publisher;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }
}
