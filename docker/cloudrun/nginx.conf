# docker/nginx.conf for one container: the API and publisher listen on loopback beside nginx.
user nginx;
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log off;
  sendfile on;
  server_tokens off;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  server {
    listen 8080;
    root /app/web;

    location / { try_files $uri $uri/ /index.html; }
    location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }

    # Same routes the Vite dev proxy forwards. SSE (/runs/:id/events) needs no buffering.
    location ~ ^/(runs|api)(/|$) {
      proxy_pass http://127.0.0.1:8788;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 1h;
      client_max_body_size 64k;
    }

    # Writer sites and citation deep links (#145): the publisher serves /w/*.
    location /w/ {
      proxy_pass http://127.0.0.1:8790;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
    }
  }
}
