worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr crit;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  access_log off;
  server_tokens off;
  # The container root is read-only (compose read_only + tmpfs /tmp): every temp path lives in /tmp.
  client_body_temp_path /tmp/client;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  resolver 127.0.0.11 valid=10s ipv6=off;
  server {
    listen 8080;
    root /usr/share/nginx/html;
    client_max_body_size 16k;
    add_header Cache-Control no-store always;
    location = /demo { return 302 https://collaboration95.github.io/theFastandtheFungible/demo/; }
    location = /demo/ { return 302 https://collaboration95.github.io/theFastandtheFungible/demo/; }
    location / { try_files $uri $uri/ /index.html; }
    location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; }
    location = /paused.html { internal; }
    # Only anonymous aggregate numbers are public; session/API routes retain no-store.
    location = /api/demo/stats {
      set $api http://api:8788;
      proxy_pass $api;
      include /etc/nginx/proxy-headers.conf;
      proxy_http_version 1.1;
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 3600s;
      proxy_connect_timeout 5s;
      proxy_hide_header Cache-Control;
      add_header Cache-Control "public, max-age=60" always;
    }
    location ~ ^/(api|runs|w|proof|livez|startupz|readyz)(/|$) {
      set $api http://api:8788;
      proxy_pass $api;
      include /etc/nginx/proxy-headers.conf;
      proxy_http_version 1.1;
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 3600s;
      proxy_connect_timeout 5s;
    }
    location = /mcp {
      set $api http://api:8788;
      proxy_pass $api;
      include /etc/nginx/proxy-headers.conf;
      proxy_http_version 1.1;
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 3600s;
      proxy_connect_timeout 5s;
    }
    # Writer discovery passes through the gateway allowlist above.
  }
}
