proxy_pass_request_headers off;
proxy_set_header Host $http_host;
proxy_set_header Cookie $http_cookie;
  proxy_set_header X-Publishing-Key $http_x_publishing_key;
  proxy_set_header X-Operator-Token $http_x_operator_token;
proxy_set_header Content-Type $http_content_type;
proxy_set_header Accept $http_accept;
proxy_set_header Accept-Encoding $http_accept_encoding;
proxy_set_header Origin $http_origin;
proxy_set_header X-CSRF-Token $http_x_csrf_token;
proxy_set_header Idempotency-Key $http_idempotency_key;
  proxy_set_header PAYMENT-SIGNATURE $http_payment_signature;
proxy_set_header Last-Event-ID $http_last_event_id;
  proxy_set_header MCP-Protocol-Version $http_mcp_protocol_version;
proxy_set_header X-Forwarded-For $http_x_forwarded_for;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header Connection "";
