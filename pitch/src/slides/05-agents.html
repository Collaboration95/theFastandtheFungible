<!-- 5 · Any agent, by URL. Logos: simple-icons (CC0) 16.38.0 for Claude, Claude Code and Cursor; 10.0.0 for VS Code. Buy side: four clients fan into one URL. Sell side: endpoint + one package → agents can buy.
     Steps (↓): 1 focuses the buy side, 2 the sell side; 0 shows both.
     Arrival (deck.js .play): the four branches draw up from the URL and each logo lifts as its line arrives; the
     drop draws down from "Agents can buy" and the check pops. -->
<section class="slide" id="s5">
  <h2>Any agent, by URL.</h2>

  <div class="card board">
    <div class="half buy">
      <h3>Agents paste one URL.</h3>

          <b>Claude</b><span>connector URL</span>
        </div>
        <div class="cl">
          <span class="tile"><svg class="logo cl-claude" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 10.5h3v3h-3v3h-1.5v3H18v-3h-1.5v3H15v-3H9v3H7.5v-3H6v3H4.5v-3H3v-3H0v-3h3v-6h18Zm-15 0h1.5v-3H6Zm10.5 0H18v-3h-1.5z"/></svg></span>
          <b>Claude Code</b><span>one command</span>
        </div>
        <div class="cl">
          <span class="tile"><svg class="logo cl-cursor" viewBox="0 0 24 24" aria-hidden="true"><path d="M11.503.131 1.891 5.678a.84.84 0 0 0-.42.726v11.188c0 .3.162.575.42.724l9.609 5.55a1 1 0 0 0 .998 0l9.61-5.55a.84.84 0 0 0 .42-.724V6.404a.84.84 0 0 0-.42-.726L12.497.131a1.01 1.01 0 0 0-.996 0M2.657 6.338h18.55c.263 0 .43.287.297.515L12.23 22.918c-.062.107-.229.064-.229-.06V12.335a.59.59 0 0 0-.295-.51l-9.11-5.257c-.109-.063-.064-.23.061-.23"/></svg></span>
          <b>Cursor</b><span>one click</span>
        </div>
        <div class="cl">
          <span class="tile"><svg class="logo cl-vscode" viewBox="0 0 24 24" aria-hidden="true"><path d="M23.15 2.587L18.21.21a1.494 1.494 0 0 0-1.705.29l-9.46 8.63-4.12-3.128a.999.999 0 0 0-1.276.057L.327 7.261A1 1 0 0 0 .326 8.74L3.899 12 .326 15.26a1 1 0 0 0 .001 1.479L1.65 17.94a.999.999 0 0 0 1.276.057l4.12-3.128 9.46 8.63a1.492 1.492 0 0 0 1.704.29l4.942-2.377A1.5 1.5 0 0 0 24 20.06V3.939a1.5 1.5 0 0 0-.85-1.352zm-5.146 14.861L10.826 12l7.178-5.448v10.896z"/></svg></span>
          <b>VS Code</b><span>one click</span>
        </div>
      </div>
      <!-- the fan, in real px (822 × 120): one branch per client, drawn from the URL end up -->
      <svg class="fan" viewBox="0 0 822 120" aria-hidden="true">
        <path class="draw" style="--t:.2" d="M102.8 0C102.8 70 380.2 55 394.6 120"/>
        <path class="draw" style="--t:.26" d="M308.2 0C308.2 70 402.8 62.5 404.8 120"/>
        <path class="draw" style="--t:.32" d="M513.8 0C513.8 70 419.2 62.5 417.2 120"/>
        <path class="draw" style="--t:.38" d="M719.2 0C719.2 70 441.8 55 427.4 120"/>
      </svg>
      <div class="url"><span class="lk"><svg class="i"><use href="#i-link"/></svg></span><span class="u">ra-front-…run.app/mcp</span></div>
    </div>

    <div class="half sell">
      <h3>Sellers add one package.</h3>
      <div class="flow">
        <div class="nd"><span class="tile"><svg class="i"><use href="#i-plug"/></svg></span><b>Your paid endpoint</b></div>
        <i class="conn"></i>
        <div class="nd pk"><span class="tile"><svg class="i"><use href="#i-key"/></svg></span><b>+ our package</b></div>
        <i class="conn"></i>
        <div class="nd ok"><span class="tile"><svg class="i"><use href="#i-agent"/></svg></span><b>Agents can buy</b></div>
      </div>
      <i class="drop" aria-hidden="true"></i>
      <div class="proof"><span class="okdot pop" style="--t:1.05"><svg class="i"><use href="#i-check"/></svg></span><span>A separate Python buyer<br>bought from it on Testnet.</span></div>
    </div>
  </div>
</section>

<style>
/* sapphire (where slide 4 ends) through ocean to sea teal (where slide 6 begins) */
#s5{background:var(--light),linear-gradient(150deg in oklch,var(--s5-a) 10%,var(--s5-m) 50%,var(--s5-b))}
#s5{display:flex;flex-direction:column}
#s5 .board{margin-top:64px;display:grid;grid-template-columns:950px 1fr;padding:0}
#s5 .half{padding:60px 64px 64px;position:relative;display:flex;flex-direction:column;transition:opacity .3s ease}
#s5 .half+.half{border-left:1px solid var(--line)}
#s5 h3{font-size:52px;letter-spacing:-.035em}

/* buy: four clients fan into one URL */
#s5 .clients,#s5 .flow{height:190px}
#s5 .clients{margin-top:60px;display:grid;grid-template-columns:repeat(4,1fr)}
#s5 .cl,#s5 .nd{display:flex;flex-direction:column;align-items:center;text-align:center}
#s5 .tile{width:96px;height:96px;border-radius:24px;font-size:46px}
#s5 .tile svg.i{stroke-width:1.75}
#s5 .tile svg.logo{width:50px;height:50px}
#s5 .cl-claude{fill:#D97757}
#s5 .cl-cursor{fill:var(--ink)}
#s5 .cl-vscode{fill:#007ACC}
#s5 .cl b,#s5 .nd b{margin-top:20px;font:750 30px/1.12 var(--f);letter-spacing:-.02em}
#s5 .cl b{white-space:nowrap}
#s5 .cl span:last-child{margin-top:6px;font:500 28px/1.15 var(--f);letter-spacing:-.015em;color:var(--ink-2);white-space:nowrap}
#s5 .fan{display:block;width:100%;height:120px;margin-top:26px;overflow:visible}
#s5 .fan path{fill:none;stroke:var(--ink-3);stroke-width:2;opacity:.6;--from:calc(var(--len)*-1)}
#s5 .url{flex:none;height:112px;border-radius:999px;background:linear-gradient(180deg,#1F3A7A,#142A5C);box-shadow:0 18px 36px -18px rgba(8,14,44,.6),0 0 0 1px rgba(255,255,255,.06) inset;
  display:flex;align-items:center;gap:26px;padding:0 44px 0 16px;color:#fff}
#s5 .url .lk{flex:none;width:80px;height:80px;border-radius:50%;background:linear-gradient(150deg in oklch,var(--s5-m),var(--s5-b));display:grid;place-items:center;font-size:40px}
#s5 .url .u{font:500 40px/1 var(--m);letter-spacing:-.03em;white-space:nowrap}

/* sell: endpoint + one package → agents can buy */
#s5 .flow{margin-top:60px;display:grid;grid-template-columns:1fr 64px 1fr 64px 1fr}
/* a dashed drop from "Agents can buy" (the flow's third column) to the proof */
#s5 .drop{height:146px;position:relative}
#s5 .drop::before{content:"";position:absolute;top:16px;bottom:0;left:calc(100% - (100% - 128px) / 6);border-left:2px dashed var(--paid);opacity:.45;transform:translateX(-1px)}
#s5 .flow .conn{margin-top:47px;min-width:0}
#s5 .nd b{text-wrap:balance;max-width:200px}
#s5 .nd.pk .tile{background:linear-gradient(180deg,#1F3A7A,#142A5C);color:#fff;box-shadow:0 10px 22px -12px rgba(8,14,44,.7)}
#s5 .nd.ok .tile{background:linear-gradient(180deg,#F2FAF6,var(--paid-bg));color:var(--paid);box-shadow:0 0 0 1px rgba(12,143,95,.2) inset}
#s5 .proof{flex:none;height:112px;border-radius:999px;background:linear-gradient(180deg,#F2FAF6,var(--paid-bg));box-shadow:0 0 0 1px rgba(12,143,95,.16) inset;
  display:flex;align-items:center;justify-content:center;gap:24px;padding:0 40px;text-align:left;font:650 30px/1.2 var(--f);letter-spacing:-.015em;color:var(--paid-ink)}
#s5 .proof .okdot{width:80px;height:80px;font-size:40px}

/* arrival: each logo lifts as its branch reaches it; the drop draws down, then the check pops (.okdot.pop) */
#s5 .cl:nth-child(2){--i:1}
#s5 .cl:nth-child(3){--i:2}
#s5 .cl:nth-child(4){--i:3}
#s5.play .cl .tile{animation:s5-lift .32s var(--ease) calc(.62s + var(--i,0)*60ms)}
#s5.play .drop::before{animation:s5-down .3s linear .75s backwards}
@keyframes s5-lift{40%{translate:0 -4px}}
@keyframes s5-down{from{clip-path:inset(0 0 100% 0)}to{clip-path:inset(0 0 0 0)}}

/* steps: focus one side */
#s5[data-focus="buy"] .sell,#s5[data-focus="sell"] .buy{opacity:.28}
</style>

<script>
{
  const el = document.getElementById('s5')
  Deck.on('s5', {
    steps: 2,
    set(n) { if (n) el.dataset.focus = n === 1 ? 'buy' : 'sell'; else delete el.dataset.focus },
  })
}
</script>
