      checked: ['Network fees from a Testnet probe: 12 drops to lock, 423 to reveal, 0.000435 XRP a purchase.',
        'The same escrow ran the 1,000 verified Testnet purchases <b>(1)</b>: median 20.3 s each.'],
      limits: ['x402 carries the payment; the key-reveal escrow (<code>escrow-v1</code>) is our own scheme, documented and drafted for upstream, not yet filed.',
        '<span class="nc">Not claimed: ledger-close times or throughput.</span>'],
      src: 'docs/key-reveal-escrow.md · docs/x402-xrpl.md · docs/FINAL-PUSH.md (D7)', url: 'docs/key-reveal-escrow.md' },

    { tile: { q: 'What if the writer never delivers?', i: ico('key') }, q: true, title: 'What if the writer never delivers?',
      means: ['No key, no payment. Collecting the money publishes the key, and the key is what unlocks the article.',
        'If the writer never publishes it, the money stays locked until <code>CancelAfter</code> (about 120 s out); then the buyer’s policy submits <code>EscrowCancel</code> and the principal returns.'],
      checked: ['No-show cancel measured at 132 s on Testnet. The attack suite includes a writer who never finishes <b>(4)</b>.',
        'Opt-in 20% holdback: 17 Testnet purchases, 11 released, 6 refunded (fixture articles with forced failures).'],
      limits: ['The buyer still pays 24 drops of fees. The deadline alone moves nothing: policy submits the cancel.',
        'A key match proves delivery, not quality; only the holdback is refundable without the writer. <span class="nc">Not claimed: refund if the article is bad.</span>'],
      src: 'docs/key-reveal-escrow.md · docs/evidence/money/HOLDBACK.md', url: 'docs/key-reveal-escrow.md' },

    { tile: { q: 'Is this real money?', s: 'Mainnet path', i: ico('bank') }, q: true, title: 'Is this real money? The Mainnet path',
      means: ['No. XRPL Testnet: a real ledger, no real value.',
        'Mainnet needs a licensed payments partner; that is the next step.'],
      checked: ['Mainnet is blocked in code (Testnet hosts only).',
        'RLUSD can’t be used in escrow yet: its issuers have escrow locking off today. We checked on Testnet and Mainnet.'],
      limits: ['No licence or legal opinion. Open: MAS PSA/DPT analysis, custody (hire flow is receive-and-forward), sanctions screening, Travel Rule. Research purchases pay from the operator’s own wallet (our interpretation, for counsel).',
        '<span class="nc">Not claimed: real money, Mainnet, regulatory clearance, RLUSD escrow.</span>'],
      src: 'docs/COMPLIANCE.md', url: 'docs/COMPLIANCE.md' },

    { tile: { q: 'Who are the writers?', i: ico('people') }, q: true, title: 'Who are the writers?',
      means: ['Today, our own team-authored notes plus 12,104 public documentation passages.',
        'Anyone can publish a note from a phone, with an operator approving each one; no outside writer has published yet.'],
      checked: ['12,104 = 8,756 passages from the XRPL dev portal + 3,348 from coinbase/x402, pinned to commit SHAs.',
        'Writers set the price per article; policy buys within the budget and the S$1 per-source cap. 3 accepted writers hold operator-issued XRPL Credentials (Testnet).'],
      limits: ['“Verified” is identity display, not KYC, quality or payment permission.',
        '<span class="nc">Not claimed: outside writers or customers, validated demand.</span>'],
      src: 'data/corpus/public-docs/manifest.json · docs/writer-verification.md', url: 'docs/writer-verification.md' },

    { tile: { q: 'Links', i: ico('link') }, kind: 'links', title: 'Links' },
  ]
  const N = CARDS.length

  /* ---------- the index ---------- */
  grid.innerHTML = CARDS.map((c, i) => {
    const t = c.tile
    const body = t.n ? `<div><div class="n">${t.n}</div><div class="c">${t.c}</div></div>` : `<div class="q">${t.q}${t.s ? `<small>${t.s}</small>` : ''}</div>`
    return `<button type="button" class="t8" data-i="${i}" aria-label="${(t.n ? t.n + ' ' + t.c : t.q)} (key ${CAP[i]})"><div class="hd"><span class="kc">${CAP[i]}</span>${t.i}</div>${body}</button>`
  }).join('')

  /* ---------- one card page ---------- */
  const nb = t => t.replace(/(\d) (s|min)\b/g, '$1\u00a0$2')   // keep a number with its unit
  const paras = a => (a || []).map(nb).map(p => p.startsWith('<span class="nc">') ? `<p class="nc">${p.slice(17, -7)}</p>` : `<p>${p}</p>`).join('')
  const src = c => `<dl class="src"><dt>Source</dt><dd>${c.src}</dd><dt></dt><dd class="u">${GH}${c.url}</dd>${c.rerun ? `<dt>Re-run</dt><dd>${c.rerun}${c.note ? ` <span class="note">(${c.note})</span>` : ''}</dd>` : ''}</dl>`
  const box = (cls, icon, head, a) => `<div class="box ${cls}"><h4>${icon}${head}</h4>${paras(a)}</div>`
  const A = (n, t, p, cls = '') => `<div class="ab ${cls}"><h5><i>${n}</i>${t}</h5><p>${nb(p)}</p></div>`
  const conn = back => `<div class="ac${back ? ' back' : ''}"><i class="conn"></i></div>`
  function bodyOf(c) {
    if (c.kind === 'arch') return `
      <div class="arch">
        ${A(1, 'Question + budget', 'Confirmed once on the 5 s plan sheet. Up to S$5 a prompt, S$1 a source.')}${conn()}
        ${A(2, 'Planner · DeepSeek', 'Clarifies, plans and writes. It does not decide purchases.')}${conn()}
        ${A(3, 'Free search', '12,104 documentation passages, local hybrid search. Free evidence first.')}
        <div class="down"><span>gap found</span></div>
        ${A(6, 'Answer + receipts', 'Citations checked against granted passages. Verify in the browser, TypeScript or Python (224 shared vectors).')}${conn(true)}
        ${A(5, 'XRPL Testnet escrow', 'HTTP 402 with <code>escrow-v1</code> terms. Locked to sha256(key); the writer’s EscrowFinish publishes the key.')}${conn(true)}
        ${A(4, 'Policy code', 'Buys within the budget, reserved atomically. The model has no purchase tool and cannot spend.', 'pol')}
      </div>
      <div class="arch-l">${box('l', I_LIMIT, 'Limits', c.limits)}</div>${src(c)}`
    if (c.kind === 'gates') {
      const G = [['No premium bytes before a grant', 'Paid text stays unreadable until the ledger validates the writer’s key reveal and proofs pass; ciphertext may arrive earlier, encrypted and quarantined.'],
        ['The budget is the only spending authority', 'Only policy code spends. The model cannot buy, raise a budget or pick a payee.'],
        ['One charge per intent', 'A crash, retry or duplicate delivery reuses the same signed transaction.'],
        ['Real citations', 'Answers cite only delivered, hash-checked passages or free sources; invented or ungranted citations are rejected.'],
        ['Anything simulated or substituted is labelled', 'Fixture, simulated and Testnet artifacts carry labels; none is shown as real.']]
      return `<div class="gates-g"><div class="box gates">${G.map(([b, s], i) => `<div class="gate"><i>${i + 1}</i><b>${b}</b><span>${s}</span></div>`).join('')}</div>
        <div class="stack">${box('k', ico('check'), 'How we checked', c.checked)}${box('l', I_LIMIT, 'Limits', c.limits)}</div></div>${src(c)}`
    }
    if (c.kind === 'links') {
      const web = [['Try it', 'the QR code', 'collaboration95.github.io/theFastandtheFungible/try/'],
        ['Live sandbox', 'XRPL Testnet, hosted 13–19 Nov', 'ra-front-651013803640.asia-southeast1.run.app'],
        ['Replay', 'no backend', 'collaboration95.github.io/theFastandtheFungible/demo/'],
        ['Ledger page', '61 Testnet transactions, re-checked in the browser', 'collaboration95.github.io/theFastandtheFungible/ledger/']]
      const repo = [['Proof report', 'docs/evidence/proof/PROOF-REPORT.md'], ['Testnet run', 'docs/evidence/proof/TESTNET-1000.md'],
        ['Escrow', 'docs/key-reveal-escrow.md'], ['Compliance', 'docs/COMPLIANCE.md'],
        ['Evaluation', 'docs/evidence/models/EVALUATION.md'], ['Q&amp;A', 'docs/submission/qa-prep.md']]
      return `<div class="links-g">
        <div class="box lk">${web.map(([b, s, u]) => `<div class="r"><b>${b}<small>${s}</small></b><code>${u}</code></div>`).join('')}</div>
        <div class="box qr"><img alt="QR code to the ResearchAgent try page"><b>Try it</b></div>
        <div class="box lk repo"><div class="r full"><b>Repo</b><code>github.com/Collaboration95/theFastandtheFungible <span class="rel">· release v1.1.1</span></code></div>${repo.map(([b, u]) => `<div class="r"><b>${b}</b><code>${u}</code></div>`).join('')}</div>
      </div>`
    }
    return `<div class="cols">${box(c.q ? 'm q' : 'm', c.q ? I_Q : ico('doc'), c.q ? 'The answer' : 'What it means', c.means)}${box('k', ico('check'), 'How we checked', c.checked)}${box('l', I_LIMIT, 'Limits', c.limits)}</div>${src(c)}`
  }
  const pageOf = (c, i, print) => `<div class="pg">
    <div class="pg-top">${print ? `<span class="pg-tag">Appendix</span>` : `<button type="button" class="pg-back" data-close aria-label="Back to the appendix"><span class="ar">←</span><span class="kc">Esc</span></button>`}
      <h2>${c.title}${c.label ? `<span class="label">${c.label}</span>` : ''}</h2><span class="kc">${CAP[i]}</span></div>
    <div class="pg-body">${bodyOf(c)}</div></div>`

  /* ---------- state: which card is open, which tile is highlighted ---------- */
  let open = -1, hi = -1
  const tiles = [...grid.children]
  function setHi(i) { hi = i; tiles.forEach((t, k) => t.classList.toggle('hi', k === i)) }
  function show(i) { open = i; setHi(i); ov.innerHTML = pageOf(CARDS[i], i, false); ov.hidden = false }
  function close() { if (open < 0) return; open = -1; ov.hidden = true; ov.innerHTML = '' }

  // the build inlines images only in the slide's markup, so the QR lives once in the section (#s8qr, hidden) and the
  // pages built at runtime take its data URI (their <img> has no src until then, so nothing is ever requested)
  const QR = document.getElementById('s8qr')?.getAttribute('src')
  const fixQr = root => QR && root.querySelectorAll('.qr img').forEach(img => img.setAttribute('src', QR))

  /* Keys run in the capture phase, before deck.js, and only while this slide is showing. A card open: every
     navigation key closes it first, so → / Space never jump past the appendix. */
  const isKey = k => KEYS.indexOf(k === '_' ? '-' : k === '+' ? '=' : k)
  addEventListener('keydown', e => {
    if (!S.classList.contains('active') || e.metaKey || e.ctrlKey || e.altKey) return
    const k = e.key, n = isKey(k)
    const eat = () => { e.preventDefault(); e.stopImmediatePropagation() }
    if (open >= 0) {
      if (n >= 0) { eat(); show(n); fixQr(ov) }
      else if (k === 'ArrowDown') { eat(); show((open + 1) % N); fixQr(ov) }
      else if (k === 'ArrowUp') { eat(); show((open + N - 1) % N); fixQr(ov) }
      else if (['Escape', 'Backspace', 'ArrowRight', 'ArrowLeft', ' ', 'Enter', 'PageDown', 'PageUp'].includes(k)) { eat(); close() }
      else if (k === 'Home' || k === 'End') close()
      return
    }
    if (n >= 0) { eat(); show(n); fixQr(ov) }
    else if (k === 'ArrowDown') { eat(); setHi(hi < 0 ? 0 : (hi + 1) % N) }
    else if (k === 'ArrowUp') { eat(); setHi(hi < 0 ? N - 1 : (hi + N - 1) % N) }
    else if (k === 'Enter' && hi >= 0) { eat(); show(hi); fixQr(ov) }
    else if (k === 'Escape' && hi >= 0) { eat(); setHi(-1) }
  }, true)

  // clicks here are the appendix's own: never the deck's click-to-advance
  S.addEventListener('click', e => {
    e.stopPropagation()
    if (e.button !== 0) return
    if (e.target.closest('[data-close]')) { close(); return }
    const t = e.target.closest('.t8')
    if (t) { show(+t.dataset.i); fixQr(ov) }
  })
  S.addEventListener('mousedown', e => { if (e.target.closest('button')) e.preventDefault() })   // keep focus off, so Space/Enter stay ours

  /* Print: the index, then one page per card, as extra slides right after this one (s801 … s812). */
  const dropPages = () => document.querySelectorAll('section.s8p').forEach(s => s.remove())
  function printPages() {
    dropPages()
    let at = S
    CARDS.forEach((c, i) => {
      const s = document.createElement('section')
      s.className = 'slide s8p'
      s.id = 's8' + String(i + 1).padStart(2, '0')
      s.innerHTML = pageOf(c, i, true)
      fixQr(s)
      at.after(s); at = s
    })
  }
  if (!Deck.PRINT) addEventListener('afterprint', dropPages)

  Deck.on('s8', {
    enter() { close(); setHi(-1) },
    leave() { close(); setHi(-1) },
    final() { close(); setHi(-1); printPages() },
  })
}
</script>
