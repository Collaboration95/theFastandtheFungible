<script>
{
  const S = document.getElementById('s8'), grid = document.getElementById('s8grid'), ov = document.getElementById('s8ov')
  const GH = 'https://github.com/Collaboration95/theFastandtheFungible/blob/main/'
  const KEYS = ['1', '2', '3', '4', '5', '6', '7', '8', '9', '0', '-', '=']
  const CAP = ['1', '2', '3', '4', '5', '6', '7', '8', '9', '0', '−', '=']
  const ico = id => `<svg class="i"><use href="#i-${id}"/></svg>`
  const svgI = d => `<svg class="i" viewBox="0 0 24 24">${d}</svg>`
  const I_STATES = svgI('<circle cx="5.5" cy="6" r="2.5"/><circle cx="18.5" cy="6" r="2.5"/><circle cx="12" cy="18" r="2.5"/><path d="M8 6h8M7 8.2l3.8 7.6M17 8.2l-3.8 7.6"/>')
  const I_RETRY = svgI('<path d="M19.5 12a7.5 7.5 0 1 1-2.2-5.3"/><path d="M19.5 3.5v4h-4"/>')
  const I_SHIELD = svgI('<path d="M12 3 19.5 6v5.5c0 4.6-3.2 8-7.5 9.5-4.3-1.5-7.5-4.9-7.5-9.5V6z"/>')
  const I_LIFT = svgI('<path d="M4 18l5.5-5.5 4 4L20 10"/><path d="M15 10h5v5"/>')
  const I_ARCH = svgI('<rect x="3" y="4" width="7" height="5" rx="1.2"/><rect x="14" y="4" width="7" height="5" rx="1.2"/><rect x="14" y="15" width="7" height="5" rx="1.2"/><rect x="3" y="15" width="7" height="5" rx="1.2"/><path d="M10 6.5h4M17.5 9v6M14 17.5h-4"/>')

  /* ---------- SVG helpers: every visual is drawn 1:1 in a 1720 × 520 card ---------- */
  const fmt = n => Math.round(n).toLocaleString('en-US')
  // the content sits 4 % in from the card's edges (scaled about the centre), so nothing crowds the rounded corners
  const svg = body => `<svg viewBox="0 0 1720 520" aria-hidden="true"><g transform="translate(860 260) scale(.955) translate(-860 -260)">${body}</g></svg>`
  const T = t => `style="--t:${(+t).toFixed(2)}"`
  const tx = (x, y, s, c = '', a = '') => `<text x="${x}" y="${y}"${c ? ` class="${c}"` : ''}${a ? ' ' + a : ''}>${s}</text>`
  const mid = 'text-anchor="middle"', end = 'text-anchor="end"'
  const draw = (d, c, t, dur = .35) => `<path d="${d}" pathLength="1" class="ln d ${c}" style="--t:${(+t).toFixed(2)};--d:${dur}s"/>`
  const tip = (x, y, deg, c, t) => `<path d="M-13 -10L0 0L-13 10" class="ln f ${c}" transform="translate(${x} ${y}) rotate(${deg.toFixed(1)})" ${T(t)}/>`
  const arrow = (x1, y1, x2, y2, c, t, dur = .3) => draw(`M${x1} ${y1}L${x2} ${y2}`, c, t, dur) + tip(x2, y2, Math.atan2(y2 - y1, x2 - x1) * 180 / Math.PI, c, t + dur * .8)
  const ic = (id, x, y, s, c = '') => `<use href="#i-${id}" x="${x}" y="${y}" width="${s}" height="${s}" class="ic ${c}"/>`
  const ok = (cx, cy, r, t) => `<g${t === undefined ? '' : ` class="p" ${T(t)}`}><circle cx="${cx}" cy="${cy}" r="${r}" class="okc"/>${ic('check', cx - r * .64, cy - r * .64, r * 1.28, 'w')}</g>`
  const flow = (d, t, dur, lin = false) => `<path d="${d}" class="fp" data-flow data-t="${t}" data-d="${dur}"${lin ? ' data-lin' : ''}/>`
  const cnt = t => `data-count data-t="${t}"`
  const badge = (cx, cy, n, c = 'gc', r = 22) => `<circle cx="${cx}" cy="${cy}" r="${r}" class="${c}"/>${tx(cx, cy + 8, n, 'w', `${mid} style="font-size:${Math.round(r * 1.05)}px;font-weight:800"`)}`

  /* 1 · 1,000 purchases: buyer → ledger (1,000 cells, re-checked green) → independent verifier */
  function v1() {
    let rows = ''
    for (let r = 0; r < 25; r++) {
      let row = ''
      for (let c = 0; c < 40; c++) row += `<rect x="${640 + c * 12}" y="${72 + r * 12}" width="9.5" height="9.5" rx="2"/>`
      rows += `<g class="cl" ${T(.3 + r * .022)}>${row}</g>`
    }
    const actor = (x, id, h, s, t) => `<g class="f" ${T(t)}><rect x="${x}" y="140" width="320" height="164" rx="24" class="sf"/>${ic(id, x + 136, 158, 48)}${tx(x + 160, 248, h, 'h', mid)}${tx(x + 160, 284, s, 'xs', mid)}</g>`
    const chip = (x, y, s, t) => `<g class="p" ${T(t)}><rect x="${x}" y="${y}" width="520" height="50" rx="25" class="okbg"/>${ok(x + 27, y + 25, 15)}${tx(x + 54, y + 34, s, 'gk', 'style="font-size:25px"')}</g>`
    return svg(`
      ${tx(880, 50, 'XRPL Testnet', 'h', mid)}

        'Limit: Testnet, no real value. Scripted repeats of one team note by fresh accounts: it proves the payment path at volume, not demand.'],
      src: 'docs/evidence/proof/TESTNET-1000.md · testnet-1000-verify.json', url: 'docs/evidence/proof/TESTNET-1000.md' },
    { tile: { n: '210,480', c: 'payment states', i: I_STATES }, title: '210,480 payment states checked', vis: v2,
      lines: ['Every reachable state of a small model of the purchase protocol, each checked against the five gates.',
        'Limit: an abstract model, not Testnet; it does not prove the real code matches the model. The count sums four configurations.'],
      src: 'docs/evidence/proof/model-summary.json · PROOF-REPORT.md', url: 'docs/evidence/proof/PROOF-REPORT.md' },
    { tile: { n: '1,000,000', c: 'crashes and retries', i: I_RETRY }, title: '1,000,000 simulated crashes and retries', vis: v3,
      lines: ['The real purchase code ran a million times against a fake ledger, one injected fault a run: 0 double charges.',
        'Limit: a synthetic ledger and logical crash points; a seeded, finite fault matrix, not a million unique paths or Testnet transactions.',
        'It found and fixed one real recovery bug (<code>CLAIM_FAILED</code> after a crash; no gate violation).'],
      src: 'docs/evidence/proof/sim-summary.json · PROOF-REPORT.md', url: 'docs/evidence/proof/sim-summary.json' },
    { tile: { n: '34', c: 'attacks', i: I_SHIELD }, title: '34 attacks on our test stack, 0 breaches', vis: v4,
      lines: ['We attacked the running purchase server like a hostile website, writer or prompt; all 34 were stopped.',
        'Limit: our local test stack (fixture models, a fake ledger for escrow cases), not the hosted deployment; our own list, not an audit.'],
      src: 'tests/proof/redteam/stack.test.ts · PROOF-REPORT.md (attack table)', url: 'docs/evidence/proof/PROOF-REPORT.md' },
    { tile: { n: '+17', c: 'correct answers', i: I_LIFT }, title: '+17 correct answers: 31 → 48 of 100', label: '(simulated payments)', vis: v5,
      lines: ['100 XRPL and x402 questions, the same in both arms; the paid arm bought on 43 runs, S$20.40 in all.',
        'Limit: a development set, not held-out (60 questions used in earlier rounds); payments simulated; team-written notes.',
        'Not claimed: held-out accuracy.'],
      src: 'docs/evidence/models/EVALUATION.md · r3-real-paired/results.json', url: 'docs/evidence/models/EVALUATION.md' },
    { tile: { q: 'Architecture', i: I_ARCH }, title: 'Architecture', vis: v6,
      lines: ['Only policy code starts a purchase, reserving the budget atomically; the model has no purchase tool.',
        'Limit: hosted buying is fixed rules after one confirmation (labelled “fixture”); a fitted decision model did no better and was removed.',
        'Limit: <code>escrow-v1</code> is our own scheme, not stock x402 <code>exact</code>; its upstream draft is not filed.'],
      src: 'docs/key-reveal-escrow.md · server/escrow.ts · docs/COMPLIANCE.md', url: 'docs/key-reveal-escrow.md' },
    { tile: { q: 'Five hard gates', i: ico('lock') }, title: 'Five hard gates', vis: v7,
      lines: ['Checked in all 210,480 model states (2), held in 1,000,000 simulated runs (3); each of the 34 attacks aims at one (4).',
        'Limit: an abstract model, a fake ledger and a local stack, all our own: not a third-party audit.'],
      src: 'README.md (Hard guarantees) · docs/COMPLIANCE.md (gate table)', url: 'README.md#hard-guarantees' },
    { tile: { q: 'Why XRPL and x402?', i: ico('wall') }, title: 'Why XRPL and x402?', vis: v8,
      lines: ['The same escrow ran the 1,000 verified Testnet purchases (1): median 20.3 s each, end to end.',
        'Limit: the key-reveal escrow (<code>escrow-v1</code>) is our own scheme on x402, documented and drafted for upstream, not yet filed.',
        'Not claimed: ledger-close times or throughput.'],
      src: 'docs/key-reveal-escrow.md · docs/x402-xrpl.md · docs/FINAL-PUSH.md (D7) · facts.json (fee_drops)', url: 'docs/key-reveal-escrow.md' },
    { tile: { q: 'What if the writer never delivers?', i: ico('key') }, title: 'What if the writer never delivers?', vis: v9,
      lines: ['No key, no payment: collecting the money publishes the key, and the key unlocks the article.',
        'Limit: the deadline alone moves nothing (buyer policy submits the cancel); the buyer still pays 24 drops of fees.',
        'Not claimed: refund if the article is bad. A key proves delivery, not quality; only the holdback refunds (its runs used forced failures).'],
      src: 'docs/key-reveal-escrow.md · docs/evidence/money/HOLDBACK.md', url: 'docs/key-reveal-escrow.md' },
    { tile: { q: 'Is this real money?', s: 'Mainnet path', i: ico('bank') }, title: 'Is this real money? The Mainnet path', vis: v10,
      lines: ['No. XRPL Testnet: a real ledger, no real value. Mainnet needs a licensed payments partner; that is the next step.',
        'Limit: no licence or legal opinion. Research purchases pay from the operator’s own wallet (our interpretation, for counsel).',
        'Not claimed: real money, Mainnet, regulatory clearance, RLUSD escrow.'],
      src: 'docs/COMPLIANCE.md', url: 'docs/COMPLIANCE.md' },
    { tile: { q: 'Who are the writers?', i: ico('people') }, title: 'Who are the writers?', vis: v11,
      lines: ['Policy code buys within the budget and the S$1 per-source cap.',
        'Limit: “verified” is identity display, not KYC, quality or payment permission.',
        'Not claimed: outside writers or customers, validated demand.'],
      src: 'data/corpus/public-docs/manifest.json · docs/writer-verification.md', url: 'docs/writer-verification.md' },
    { tile: { q: 'Links', i: ico('link') }, kind: 'links', title: 'Links' },
  ]
  const N = CARDS.length

  /* ---------- the index ---------- */
  grid.innerHTML = CARDS.map((c, i) => {
    const t = c.tile
    const body = t.n ? `<div><div class="n">${t.n}</div><div class="c">${t.c}</div></div>` : `<div class="q">${t.q}${t.s ? `<small>${t.s}</small>` : ''}</div>`
    return `<button type="button" class="t8" data-i="${i}" aria-label="${(t.n ? t.n + ' ' + t.c : t.q)} (key ${CAP[i]})"><div class="hd"><span class="kc">${CAP[i]}</span>${t.i}</div>${body}</button>`
  }).join('')

  /* ---------- one card page ---------- */
  const nb = t => t.replace(/(\d) (s|min)\b/g, '$1 $2')   // keep a number with its unit
  const line = s => { const m = s.match(/^(Limit|Not claimed):\s*/); return m ? `<p class="lim"><b>${m[1]}:</b> ${nb(s.slice(m[0].length))}</p>` : `<p>${nb(s)}</p>` }
  const src = c => `<dl class="src"><dt>Source</dt><dd>${c.src}</dd><dt></dt><dd class="u">${GH}${c.url}</dd></dl>`
  function bodyOf(c) {
    if (c.kind === 'links') {
      const web = [['Try it', 'the QR code', 'collaboration95.github.io/theFastandtheFungible/try/', 'agent'],
        ['Live sandbox', 'XRPL Testnet, hosted 13–19 Nov', 'ra-front-651013803640.asia-southeast1.run.app', 'plug'],
        ['Replay', 'no backend', 'collaboration95.github.io/theFastandtheFungible/demo/', 'doc'],
        ['Ledger page', '61 Testnet transactions, re-checked in the browser', 'collaboration95.github.io/theFastandtheFungible/ledger/', 'ledger']]
      const repo = [['Proof report', 'docs/evidence/proof/PROOF-REPORT.md'], ['Testnet run', 'docs/evidence/proof/TESTNET-1000.md'],
        ['Escrow', 'docs/key-reveal-escrow.md'], ['Compliance', 'docs/COMPLIANCE.md'],
        ['Evaluation', 'docs/evidence/models/EVALUATION.md']]
      return `<div class="links-g">
        <div class="box lk" style="--t:0">${web.map(([b, s, u, id]) => `<div class="r"><span class="tile">${ico(id)}</span><div><b>${b}<small>${s}</small></b><code>${u}</code></div></div>`).join('')}</div>
        <div class="box qr" style="--t:.12"><img alt="QR code to the ResearchAgent try page"><b>Try it</b></div>
        <div class="box lk repo" style="--t:.24"><div class="r full"><b>Repo</b><code>github.com/Collaboration95/theFastandtheFungible <span class="rel">· release v1.1.1</span></code></div>${repo.map(([b, u]) => `<div class="r"><b>${b}</b><code>${u}</code></div>`).join('')}</div>
      </div>`
    }
    return `<div class="vis">${c.vis()}</div><div class="lns">${c.lines.map(line).join('')}</div>${src(c)}`
  }
  const pageOf = (c, i, print) => `<div class="pg">
    <div class="pg-top">${print ? `<span class="pg-tag">Appendix</span>` : `<button type="button" class="pg-back" data-close aria-label="Back to the appendix"><span class="ar">←</span><span class="kc">Esc</span></button>`}
      <h2>${c.title}${c.label ? `<span class="label">${c.label}</span>` : ''}</h2><span class="kc">${CAP[i]}</span></div>
    <div class="pg-body">${bodyOf(c)}</div></div>`

  /* ---------- motion when a card opens: CSS keyframes under .go, numbers count up, one token flows along each data-flow path ---------- */
  const NS = 'http://www.w3.org/2000/svg'
  let gen = 0
  const easeOut = k => 1 - Math.pow(1 - k, 3), easeInOut = k => k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2
  function after(t0, dur, fn, g) {   // calls fn(k) each frame from t0 for dur ms with k in 0…1, until a card closes or changes
    const tick = now => { if (g !== gen) return; const k = Math.min(1, Math.max(0, (now - t0) / dur)); fn(k); if (k < 1) requestAnimationFrame(tick) }
    requestAnimationFrame(tick)
  }
  function animate(root) {
    const g = ++gen
    if (Deck.REDUCE || Deck.PRINT) return
    root.classList.remove('go'); void root.offsetWidth; root.classList.add('go')
    const now = performance.now()
    root.querySelectorAll('[data-count]').forEach(el => {
      const fin = el.textContent, m = fin.match(/\d[\d,]*/)
      if (!m) return
      const n = +m[0].replace(/,/g, '')
      after(now + (+el.dataset.t || 0) * 1000, 600, k => { el.textContent = k >= 1 ? fin : fin.replace(m[0], fmt(n * easeOut(k))) }, g)
    })
    root.querySelectorAll('[data-flow]').forEach(p => {
      const len = p.getTotalLength(), c = document.createElementNS(NS, 'circle'), lin = p.hasAttribute('data-lin')
      c.setAttribute('r', '10'); c.setAttribute('class', 'tok'); c.style.opacity = '0'
      p.parentNode.appendChild(c)
      after(now + (+p.dataset.t || 0) * 1000, (+p.dataset.d || 1) * 1000, k => {
        const pt = p.getPointAtLength((lin ? k : easeInOut(k)) * len)
        c.setAttribute('cx', pt.x.toFixed(1)); c.setAttribute('cy', pt.y.toFixed(1))
        c.style.opacity = String(Math.min(1, k * 10, (1 - k) * 10))
        if (k >= 1) c.remove()
      }, g)
    })
  }

  /* ---------- state: which card is open, which tile is highlighted ---------- */
  let open = -1, hi = -1
  const tiles = [...grid.children]
  function setHi(i) { hi = i; tiles.forEach((t, k) => t.classList.toggle('hi', k === i)) }
  // the URL follows the open card: #8.1 … #8.12 (card N is the Nth key: 1 … 9, 0, −, =); #8 when none is open
  const setHash = h => { try { history.replaceState(null, '', location.search + h) } catch { /* refused on some file:// */ } }
  const cardOfHash = () => { const m = location.hash.match(/^#8\.(\d+)$/); const i = m ? +m[1] - 1 : -1; return i >= 0 && i < N ? i : -1 }
  function show(i) { open = i; setHi(i); ov.innerHTML = pageOf(CARDS[i], i, false); ov.hidden = false; fixQr(ov); animate(ov); setHash('#8.' + (i + 1)) }
  function close() { gen++; if (open < 0) return; open = -1; ov.hidden = true; ov.innerHTML = ''; ov.classList.remove('go'); if (S.classList.contains('active')) setHash('#8') }

  // the build inlines images only in the slide's markup, so the QR lives once in the section (#s8qr, hidden) and the
  // pages built at runtime take its data URI (their <img> has no src until then, so nothing is ever requested)
  const QR = document.getElementById('s8qr')?.getAttribute('src')
  const fixQr = root => QR && root.querySelectorAll('.qr img').forEach(img => img.setAttribute('src', QR))

  /* Keys run in the capture phase, before deck.js, and only while this slide is showing. A card open: every
     navigation key closes it first, so → / Space never jump past the appendix. */
  const isKey = k => KEYS.indexOf(k === '_' ? '-' : k === '+' ? '=' : k)
  addEventListener('keydown', e => {
    if (!S.classList.contains('active') || e.metaKey || e.ctrlKey || e.altKey) return
    const k = e.key, n = isKey(k)
    const eat = () => { e.preventDefault(); e.stopImmediatePropagation() }
    if (open >= 0) {
      if (n >= 0) { eat(); show(n) }
      else if (k === 'ArrowDown') { eat(); show((open + 1) % N) }
      else if (k === 'ArrowUp') { eat(); show((open + N - 1) % N) }
      else if (['Escape', 'Backspace', 'ArrowRight', 'ArrowLeft', ' ', 'Enter', 'PageDown', 'PageUp'].includes(k)) { eat(); close() }
      else if (k === 'Home' || k === 'End') close()
      return
    }
    if (n >= 0) { eat(); show(n) }
    else if (k === 'ArrowDown') { eat(); setHi(hi < 0 ? 0 : (hi + 1) % N) }
    else if (k === 'ArrowUp') { eat(); setHi(hi < 0 ? N - 1 : (hi + N - 1) % N) }
    else if (k === 'Enter' && hi >= 0) { eat(); show(hi) }
    else if (k === 'Escape' && hi >= 0) { eat(); setHi(-1) }
  }, true)

  // clicks here are the appendix's own: never the deck's click-to-advance
  S.addEventListener('click', e => {
    e.stopPropagation()
    if (e.button !== 0) return
    if (e.target.closest('[data-close]')) { close(); return }
    const t = e.target.closest('.t8')
    if (t) show(+t.dataset.i)
  })
  S.addEventListener('mousedown', e => { if (e.target.closest('button')) e.preventDefault() })   // keep focus off, so Space/Enter stay ours

  /* Print: the index, then one page per card, as extra slides right after this one (s801 … s812), finished diagrams. */
  const dropPages = () => document.querySelectorAll('section.s8p').forEach(s => s.remove())
  function printPages() {
    dropPages()
    let at = S
    CARDS.forEach((c, i) => {
      const s = document.createElement('section')
      s.className = 'slide s8p'
      s.id = 's8' + String(i + 1).padStart(2, '0')
      s.innerHTML = pageOf(c, i, true)
      fixQr(s)
      at.after(s); at = s
    })
  }
  if (!Deck.PRINT) addEventListener('afterprint', dropPages)

  addEventListener('hashchange', () => { const i = cardOfHash(); if (S.classList.contains('active') && i >= 0 && i !== open) show(i) })

  Deck.on('s8', {
    enter() { const i = cardOfHash(); close(); setHi(-1); if (i >= 0) show(i) },
    leave() { close(); setHi(-1) },
    final() { close(); setHi(-1); printPages() },
  })
}
</script>
