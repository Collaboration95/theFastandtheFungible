<!-- 1 · Frame. Headline A (B "Knowledge work is going agentic. Knowledge is still paywalled."
     C "Your next reader is an agent. It stops at the paywall.").
     One-liner alternates:
       "ResearchAgent: agents buy the one article they need; writers get paid."
       "ResearchAgent: agents pay past the paywall, and writers get paid." -->
<section class="slide f-book" id="s1">
  <h1>Agents do the research now.<br>The best research is <span class="mk">paywalled.</span></h1>

  <!-- arrival (deck.js .play): a bot and a priced article run their dotted tracks into one brick paywall, bump back,
       and each row's outcome pops out of the impact. The resting CSS is the final state (print, reduced motion, ←). -->
  <div class="card sides rows">
    <i class="brick" aria-hidden="true"></i>
    <div class="row" style="grid-row:1">
      <span class="who"><span class="tile"><svg class="i"><use href="#i-agent"/></svg></span>Agents</span>
      <span class="trk" aria-hidden="true"><span class="run" style="--t:.3"><span class="go bump" style="--t:.7"><svg class="i"><use href="#i-agent"/></svg></span></span></span>
      <span class="pill wall pop" style="--t:.72">hit the paywall</span>
      <i class="conn draw" style="--t:.95"></i>
      <span class="out" style="--t:.95">settle for what’s free</span>
    </div>
    <div class="row" style="grid-row:2">
      <span class="who"><span class="tile"><svg class="i"><use href="#i-pen"/></svg></span>Writers</span>
      <span class="trk" aria-hidden="true"><span class="run" style="--t:.5"><span class="go doc bump" style="--t:.9"><svg class="i"><use href="#i-doc"/></svg><b>S$</b></span></span></span>
      <span class="pill wall pop" style="--t:.92">can’t sell to agents</span>
      <i class="conn draw" style="--t:1.15"></i>
      <span class="out" style="--t:1.15">their best work goes unread</span>
    </div>
  </div>

  <p class="line"><span class="bt"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4H4v16h5M15 4h5v16h-5M9 15l6-6"/></svg></span><span><b>ResearchAgent:</b> agents buy the article they need, writers get&nbsp;paid.</span></p>
</section>

<style>
/* golden hour: lilac above, apricot at the horizon, rose hills under the card; dark ink on the light sky */
#s1{--scene:url("../scenes/s1.svg");--bk-ink:var(--ink);--bk-ink-2:#2C3150;--bk-line:rgba(60,30,50,.14);--bk-brand:var(--ink);
  background:radial-gradient(1100px 380px at 50% 74%,rgba(255,222,180,.7),rgba(255,222,180,0) 70%),linear-gradient(180deg,var(--s1-z),var(--s1-m) 40%,var(--s1-l) 64%,var(--s1-h))}
#s1{display:flex;flex-direction:column;padding-top:100px;padding-bottom:92px}
#s1 h1{font-size:108px;letter-spacing:-.052em;line-height:1.02;white-space:nowrap}
#s1 h1 .mk{--mk-c:var(--bk-mk)}

#s1 .sides{margin-top:auto;box-shadow:var(--sh-card),0 0 0 1px var(--bk-line);display:grid;column-gap:28px;padding:0 52px;
  grid-template-columns:auto minmax(190px,2.4fr) 20px auto minmax(88px,1fr) auto}
#s1 .row{grid-column:1/-1;display:grid;grid-template-columns:subgrid;align-items:center;height:150px}
#s1 .who{display:flex;align-items:center;gap:22px;font:750 52px/1 var(--f);letter-spacing:-.035em;min-width:300px}
/* the pills sit flush against the wall, as if knocked out of it */
#s1 .pill{grid-column:4;margin-left:-22px;font-size:34px;padding:14px 26px;letter-spacing:-.02em}
#s1 .out{font:600 44px/1 var(--f);letter-spacing:-.03em;color:var(--ink-2);white-space:nowrap}

/* the paywall: one brick strip down both rows (20 × 12 px bricks, offset courses) */
#s1 .brick{position:relative;z-index:1;grid-column:3;grid-row:1/3;align-self:stretch;margin:26px 0;border-radius:4px;--b:#EC6A36;--m:#fff;
  background:
    repeating-linear-gradient(180deg,transparent 0 10px,var(--m) 10px 12px),
    linear-gradient(180deg,var(--b) 0 10px,transparent 10px) 0 0/100% 24px repeat-y,
    linear-gradient(90deg,transparent 9px,var(--m) 9px 11px,transparent 11px),
    var(--b);
  box-shadow:0 0 0 1px rgba(178,60,12,.18)}
#s1.play .brick{animation:shake .18s linear .7s backwards,shake2 .18s linear .9s}
@keyframes shake2{20%{transform:translateX(3px)}45%{transform:translateX(-2px)}72%{transform:translateX(1px)}}

/* the dotted track and its traveller: a bot (row 1), a priced article (row 2). They rest knocked back, tilted. */
#s1 .trk{position:relative;align-self:stretch;
  background:radial-gradient(circle,var(--ink-3) 1.5px,transparent 2px) 0 50%/13px 4px repeat-x;margin-right:-28px}
#s1 .run{position:absolute;right:0;top:50%;margin-top:-26px;--dist:128px}
#s1 .go{display:grid;place-items:center;width:52px;height:52px;border-radius:15px;font-size:32px;color:var(--ink);
  background:linear-gradient(180deg,#fff,#EEF0F6);box-shadow:0 0 0 1.5px #D5D9E6 inset,0 4px 10px -4px rgba(8,14,44,.35);
  transform-origin:50% 100%;transform:translateX(-26px) rotate(-4deg);--back:26px;--tilt:-8deg}
#s1 .go.doc{position:relative}
/* the price dot sticks out 14 px, so the article meets the wall with its dot */
#s1 .run:has(.doc){right:14px}
#s1 .go.doc b{position:absolute;right:-14px;top:-14px;width:32px;height:32px;border-radius:50%;background:#FFD43B;color:#3A2A00;
  display:grid;place-items:center;font:800 14px/1 var(--f);letter-spacing:-.04em;box-shadow:0 0 0 2.5px #fff,0 2px 5px -1px rgba(120,80,0,.4)}

/* before each row's outcome lands it waits faded */
#s1.play .out{animation:s1-out .25s var(--ease) calc(var(--t)*1s) backwards}
@keyframes s1-out{from{opacity:.35}}
#s1 .pill{--o:0 50%}

#s1 .line{margin-top:auto;display:flex;align-items:center;gap:26px;font:500 46px/1.15 var(--f);letter-spacing:-.025em;color:var(--bk-ink-2);text-wrap:nowrap}
#s1 .line b{font-weight:750;color:var(--bk-ink)}
/* the brand tile, as on the intro: white rounded square, black mark */
#s1 .bt{flex:none;width:68px;height:68px;border-radius:16px;background:#fff;border:1.5px solid #DADDE6;box-shadow:0 6px 14px -6px rgba(13,19,48,.3);display:grid;place-items:center}
#s1 .bt svg{width:50px;height:50px;fill:none;stroke:#24211E;stroke-width:1.9;stroke-linecap:square}
</style>
