[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "researchagent"
version = "1.0.1"
readme = "README.md"
description = "Typed, standard-library ResearchAgent client"
requires-python = ">=3.10"
license = "MIT"

[project.scripts]
researchagent = "researchagent.__main__:main"

[tool.setuptools.package-data]
researchagent = ["py.typed", "*-schema.json", "_vendor/*LICENSE", "_vendor/NOTICE.md"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
