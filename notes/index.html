<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Talk script</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&family=Geist+Mono:wght@500..600&display=swap">
<!--
  Speaker script for the AIT deck (../slides/), four slides per screen.
  KEYS  → / Space / click right half: next four · ← / click left half: back · Home / End
  Edit the SCRIPT list at the bottom: title = the slide's headline, say = what to say, cue = what to press or watch.
-->
<style>
:root {
  color-scheme: light;
  --paper: #F6F7F9; --sheet: #FFFFFF; --rule: #D9DDE6;
  --ink: #0F1222; --ink-2: #2B3046; --muted: #555B70; --pen: #2F45FF; --pen-wash: #ECEEFF;
  --f-ui: 'Geist', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --f-mono: 'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace;
  --t: min(2.9vw, 4.8vh); /* the start size; fit() shrinks it until every card fits */
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--paper); color: var(--ink); font-family: var(--f-ui); -webkit-font-smoothing: antialiased; overflow: hidden; }
main { height: 100%; padding: 1.6vh 1.4vw 4.2vh; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 1.4vh 1.1vw; }
.card { background: var(--sheet); border: 2px solid var(--rule); border-radius: 14px; padding: 2.2vh 1.6vw; display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
.card.empty { visibility: hidden; }
.top { display: flex; align-items: flex-start; gap: 1vw; }
.title { flex: 1; font: 600 calc(var(--t) * .62)/1.25 var(--f-mono); color: var(--muted); letter-spacing: .01em; }
.num { font: 700 calc(var(--t) * 1.5)/.9 var(--f-mono); color: var(--pen); }
.say { margin: 2vh 0 0; font: 500 var(--t)/1.36 var(--f-ui); color: var(--ink); text-wrap: pretty; }
.cue { margin-top: auto; padding-top: 1.4vh; font: 600 calc(var(--t) * .62)/1.3 var(--f-mono); color: var(--pen); }
.cue span { background: var(--pen-wash); border-radius: 6px; padding: .3em .55em; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
footer { position: fixed; left: 1.4vw; right: 1.4vw; bottom: 1vh; display: flex; justify-content: space-between; font: 500 calc(var(--t) * .5) var(--f-mono); color: var(--muted); }
</style>
</head>
<body>
<main id="grid" aria-live="polite"></main>
<footer><span id="pos"></span><span>→ next four · ← back</span></footer>
<script>
const SCRIPT = [
  { title: 'ResearchAgent',
    say: "Hi, I'm Guru. I'll demo ResearchAgent, then show how we picked the model at its heart." },
  { title: 'Kestrel–TSMC outlook',
    say: 'The free answer has no margin guidance. Watch it skip the S$0.10 op-ed and the S$0.20 rewrite, and buy the S$0.90 original.',
    cue: 'Kestrel–TSMC preset · S$2 · don’t press Stop' },
  { title: 'Three layers: A asks, B sells, C settles',
    say: 'You set a budget, the agent searches and pays writers, the ledger settles. The agent checks the ledger itself. The purple box is the rest of this talk.',
    cue: 'No clicks: the arrows pulse 1 → 8 on their own' },
  { title: 'A decision model answers in numbers, not sentences',
    say: 'A language model gives you a sentence. A decision model gives you numbers, and code can put a threshold on a number.' },
  { title: 'The model scores. Code buys.',
    say: 'The model scores, code buys. Only the original clears the bar.' },
  { title: 'So how do we decide?',
    say: "On paper, Clef-flash beat Jev. But none of those tests asks our question. Then OpenAI shipped Decisions, so we wrote our own test.",
    cue: 'One press: four lines fade in' },
  { title: 'One prompt to a coding agent. The pass mark set first.',
    say: 'One prompt, run unattended, capped at US$10. The pass mark was written before the first API call.' },
  { title: 'On held-out scenarios, OpenAI Decisions scored 0.98 and Clef-flash 0.78',
    say: "0.98 versus 0.78. Neither model's probabilities were honest out of the box, so we calibrated them on the dev split only. Cost is about the same." },
  { title: 'Take vendor benchmarks with a grain of salt',
    say: 'The 39 ms model took 583 ms from our laptop. Vendors time their servers on their own tests. Test on your own question.' },
  { title: 'The same prompt change helped one model and broke the other',
    say: "One wording change: OpenAI Decisions went 0.67 → 0.90, Clef-flash fell 0.40 → 0.12. Prompts don't carry over between models." },
  { title: 'Same input, same answer, every time. Until we reordered the options.',
    say: "Same input, same answer every time, until we reordered the options: 0.99 became 0.05. Deterministic isn't the same as invariant." },
  { title: 'The better model failed our own rule',
    say: 'The better model failed our own rule on the refund demo. We fixed the story, not the judge, and switched on 8 Oct. Clef-flash is a one-line revert.',
    cue: 'Click before “We fixed the story”' },
  { title: 'Pick one',
    say: 'Scan for the replay or the project map. Thanks!' },
];

const PER = 4, pages = Math.ceil(SCRIPT.length / PER);
const esc = t => t.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
let page = Math.min(pages - 1, Math.max(0, (parseInt(location.hash.slice(1), 10) || 1) - 1));

function render() {
  const cards = [];
  for (let k = 0; k < PER; k++) {
    const i = page * PER + k, s = SCRIPT[i];
    cards.push(s
      ? `<section class="card"><div class="top"><div class="title">${esc(s.title)}</div><div class="num">${i + 1}</div></div>`
        + `<p class="say">${esc(s.say)}</p>` + (s.cue ? `<div class="cue"><span>${esc(s.cue)}</span></div>` : '') + `</section>`
      : '<section class="card empty"></section>');
  }
  document.getElementById('grid').innerHTML = cards.join('');
  const first = page * PER + 1, last = Math.min(SCRIPT.length, first + PER - 1);
  document.getElementById('pos').textContent = `Slides ${first}–${last} of ${SCRIPT.length} · screen ${page + 1}/${pages}`;
  history.replaceState(null, '', '#' + (page + 1));
  fit();
}
// largest text that fits: start from the CSS size, shrink 4% at a time while any card overflows
function fit() {
  const root = document.documentElement.style;
  root.removeProperty('--t');
  let t = parseFloat(getComputedStyle(document.querySelector('.say') || document.body).fontSize);
  const over = () => [...document.querySelectorAll('.card')].some(c => c.scrollHeight > c.clientHeight + 1);
  while (over() && t > 12) { t *= .96; root.setProperty('--t', t + 'px'); }
}
addEventListener('resize', fit);
document.fonts?.ready.then(fit);
const go = p => { page = Math.max(0, Math.min(pages - 1, p)); render(); };
addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (['ArrowRight', 'ArrowDown', 'PageDown', ' ', 'Enter'].includes(e.key)) { e.preventDefault(); go(page + 1); }
  else if (['ArrowLeft', 'ArrowUp', 'PageUp', 'Backspace'].includes(e.key)) { e.preventDefault(); go(page - 1); }
  else if (e.key === 'Home') go(0);
  else if (e.key === 'End') go(pages - 1);
});
addEventListener('click', e => go(page + (e.clientX > innerWidth / 2 ? 1 : -1)));
render();
</script>
</body>
</html>
