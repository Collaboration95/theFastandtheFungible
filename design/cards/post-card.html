<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ResearchAgent · daily post card</title>
<style>:root{color-scheme:light;--paper:#FBF8F2;--ink:#24211E;--salmon:#D9A28F;--green:#2F6B4F}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:system-ui,sans-serif}.card{width:1200px;height:630px;padding:52px 64px;display:grid;grid-template-columns:1.5fr 1fr;grid-template-rows:auto 1fr auto;gap:16px 48px;border-top:12px solid var(--salmon)}header{grid-column:1/-1;display:flex;justify-content:space-between;font:700 18px ui-monospace,monospace;letter-spacing:.08em}h1{font-size:64px;line-height:1.05;letter-spacing:-.045em;margin:24px 0;overflow-wrap:anywhere}.metric{font:600 27px/1.4 ui-monospace,monospace;color:var(--green)}.cast{align-self:center;width:340px;height:340px}footer{grid-column:1/-1;border-top:1px solid var(--salmon);padding-top:16px;display:flex;justify-content:space-between;font-size:17px}.portrait{width:1080px;height:1350px;padding:64px;grid-template-columns:1fr;grid-template-rows:auto auto 1fr auto;gap:32px}.portrait header{grid-column:1}.portrait h1{font-size:88px}.portrait .cast{width:520px;height:520px;justify-self:center}.portrait footer{grid-column:1}</style></head><body><main class="card"><header><span>RESEARCHAGENT / BUILD LOG</span><span>SFF 2026</span></header><section><h1 data-title>Meet the cast.</h1><p class="metric" data-metric>15 → 30 evidence-backed feedback items</p></section><img class="cast" data-cast src="../../src/assets/cast/scout-paying.svg" alt="Scout paying · illustration"><footer><span data-note>Illustration · fictional writers · no live payment</span><span>XRPL TESTNET · no real value</span></footer></main></body></html>
