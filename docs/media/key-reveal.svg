<svg xmlns="http://www.w3.org/2000/svg" width="840" height="392" viewBox="0 0 840 392" role="img" aria-label="Key-reveal escrow in five steps: policy code locks payment to the hash of the article key; the writer publishes the key on the ledger and is paid; the buyer decrypts and checks every promise; a broken promise can trigger a refund request; the answer is anchored on the ledger">
<rect width="840" height="392" fill="#FBF8F2"/>
<defs><marker id="head" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#24211E"/></marker></defs>
<g font-family="system-ui,sans-serif" fill="#24211E">
<rect x="55" y="20" width="190" height="40" rx="4" fill="#fff" stroke="#C9BFB2"/><text x="150" y="45" font-size="15" text-anchor="middle">Policy code (buyer)</text><path d="M150 60V352" stroke="#C9BFB2" stroke-dasharray="3 4"/>
<rect x="345" y="20" width="190" height="40" rx="4" fill="#fff" stroke="#C9BFB2"/><text x="440" y="45" font-size="15" text-anchor="middle">XRP Ledger</text><path d="M440 60V352" stroke="#C9BFB2" stroke-dasharray="3 4"/>
<rect x="635" y="20" width="190" height="40" rx="4" fill="#fff" stroke="#C9BFB2"/><text x="730" y="45" font-size="15" text-anchor="middle">Writer</text><path d="M730 60V352" stroke="#C9BFB2" stroke-dasharray="3 4"/>
<circle cx="40" cy="108" r="11" fill="#24211E"/><text x="40" y="112" font-size="12" fill="#fff" text-anchor="middle">1</text><path d="M150 108L438 108" stroke="#24211E" marker-end="url(#head)"/><rect x="158.0" y="84" width="274.1" height="21" fill="#FBF8F2"/><text x="295" y="99" font-size="13" text-anchor="middle">EscrowCreate · locked to sha256(key)</text>
<circle cx="40" cy="160" r="11" fill="#24211E"/><text x="40" y="164" font-size="12" fill="#fff" text-anchor="middle">2</text><path d="M730 160L442 160" stroke="#24211E" marker-end="url(#head)"/><rect x="433.4" y="136" width="303.2" height="21" fill="#FBF8F2"/><text x="585" y="151" font-size="13" text-anchor="middle">EscrowFinish publishes key · writer paid</text>
<circle cx="40" cy="212" r="11" fill="#24211E"/><text x="40" y="216" font-size="12" fill="#fff" text-anchor="middle">3</text><rect x="65" y="196" width="280" height="32" rx="4" fill="#fff" stroke="#24211E"/><text x="205" y="217" font-size="13" text-anchor="middle">Decrypt · check every signed promise</text>
<circle cx="40" cy="264" r="11" fill="#24211E"/><text x="40" y="268" font-size="12" fill="#fff" text-anchor="middle">4</text><path d="M730 264L152 264" stroke="#24211E" stroke-dasharray="5 4" marker-end="url(#head)"/><rect x="306.6" y="240" width="266.8" height="21" fill="#FBF8F2"/><text x="440" y="255" font-size="13" text-anchor="middle">Refund request for a broken promise</text>
<circle cx="40" cy="316" r="11" fill="#24211E"/><text x="40" y="320" font-size="12" fill="#fff" text-anchor="middle">5</text><path d="M150 316L438 316" stroke="#24211E" marker-end="url(#head)"/><rect x="154.3" y="292" width="281.4" height="21" fill="#FBF8F2"/><text x="295" y="307" font-size="13" text-anchor="middle">Anchor the answer · memo = audit head</text>
<text x="32" y="378" font-size="12" fill="#655D55">Key reveal binds article access to payment; inspect the create, finish and answer anchor.</text></g></svg>
