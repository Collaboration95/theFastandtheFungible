body{font:14px var(--font-sans,system-ui);color:var(--foreground,#27272a);margin:0}button{font:inherit;border:1px solid var(--border,#d4d4d8);background:var(--secondary,#f4f4f5);color:inherit;border-radius:var(--radius,6px);padding:6px 10px;cursor:pointer}button[aria-pressed=true]{border-color:var(--primary,#2563eb)}.controls{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}.legend{display:flex;gap:20px;font-size:12px;color:var(--muted-foreground,#71717a)}.dot{display:inline-block;width:10px;height:10px;margin-right:5px;background:var(--chart-1,#94a3b8)}.after{background:var(--chart-2,#0d9488)}.plot{height:230px;margin:18px 0 0;display:flex;flex-direction:column;gap:18px}.group{display:grid;grid-template-columns:72px 1fr;align-items:center;gap:8px}.bars{display:grid;gap:5px}.line{display:flex;align-items:center;gap:8px}.track{width:70%;height:15px;background:var(--secondary,#f4f4f5);border-radius:3px;overflow:hidden}.bar{height:100%;background:var(--chart-1,#94a3b8)}.bar.after{background:var(--chart-2,#0d9488)}.value{font:12px var(--font-mono,monospace)}.note{font-size:12px;color:var(--muted-foreground,#71717a);line-height:1.5;margin:8px 0}
</style></head><body><p class="note">Development banks · fixture models · XRPL Testnet · faucet funds only</p><div class="controls" role="group" aria-label="Metric"><button data-metric="candidateFound" aria-pressed="true">Candidate found</button><button data-metric="buyAndCite" aria-pressed="false">Buy and cite</button><button data-metric="answersIt" aria-pressed="false">answersIt</button></div><div class="legend"><span><i class="dot"></i>Before</span><span><i class="dot after"></i>After</span></div><div class="plot" id="plot" aria-live="polite"></div><p class="note">Negative buys: 2/10 → 2/10. Both negative-bank runs remain failures. These results do not establish held-out or live-model quality.</p><script>const rows=[{"phase": "before", "bank": "v1", "bankSha256": "eb03dde7d387193ff32af5c95ef6161546b7c35b91a2ff14b2040f3d2fe26dfc", "artifactSha256": "72f32ec541a4faa742ce19a51bc91d2ffdccfc01d8ef8122e5a44518590b777f", "completed": 20, "candidateFound": {"n": 20, "N": 20}, "buyAndCite": {"n": 16, "N": 20}, "answersIt": {"n": 0, "N": 0}, "negativeBuys": {"n": 0, "N": 0}, "onlineVerification": {"n": 20, "N": 20}, "originalRunnerAuditViolations": 0, "exactArtifactRawAuditViolations": 0, "buyingNegatives": []}, {"phase": "before", "bank": "v3", "bankSha256": "8d0c378b130b547e0dbf299eb7ee9775bd15151e1cda07c061b13105eb1cce5f", "artifactSha256": "72f32ec541a4faa742ce19a51bc91d2ffdccfc01d8ef8122e5a44518590b777f", "completed": 20, "candidateFound": {"n": 17, "N": 20}, "buyAndCite": {"n": 7, "N": 20}, "answersIt": {"n": 4, "N": 20}, "negativeBuys": {"n": 0, "N": 0}, "onlineVerification": {"n": 20, "N": 20}, "originalRunnerAuditViolations": 1, "exactArtifactRawAuditViolations": 0, "buyingNegatives": []}, {"phase": "before", "bank": "v3-dev", "bankSha256": "6c4b81cda9bbebd3889ddb8e9f709a3a948cb388d6a08be381eab908e85e32f7", "artifactSha256": "72f32ec541a4faa742ce19a51bc91d2ffdccfc01d8ef8122e5a44518590b777f", "completed": 20, "candidateFound": {"n": 16, "N": 20}, "buyAndCite": {"n"
